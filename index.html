<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Saymu ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">
  <h1>💖 A Special Surprise For Saymu 💖</h1>
  <p>Loading Love...</p>
</div>

<div id="main" style="display:none;">

  <h1>Hi Saymu ❤️</h1>

  <p class="quote">
    "Some people make the world beautiful just by being in it.
    You are one of them."
  </p>

  <button onclick="showLetter()">💌 Open My Heart</button>

  <div id="letter">
    <h2>For You ❤️</h2>

    <p id="typing"></p>

    <button onclick="showGallery()">
      📸 Our Memories
    </button>

  </div>

  <div id="gallery" style="display:none;">

    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">

  </div>

  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <button id="musicBtn" onclick="playMusic()">
    🎵 Play Music
  </button>

</div>

<script src="script.js"></script>

</body>
</html>
