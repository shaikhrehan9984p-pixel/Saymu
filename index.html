<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Saymu 🌷❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:420px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
text-align:center;
color:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.bouquet{
font-size:70px;
animation:bounce 2s infinite;
}

h1{
margin:15px 0;
font-size:32px;
}

p{
font-size:18px;
line-height:1.6;
}

button{
margin-top:20px;
padding:12px 28px;
border:none;
border-radius:30px;
background:#fff;
color:#ff4081;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#letter{
display:none;
margin-top:20px;
}

@keyframes bounce{
50%{transform:translateY(-10px);}
}
</style>
</head>
<body>

<div class="card">

<div class="bouquet">💐🌷💐</div>

<h1>Hey Cutie Pie Saymu 🌷❤️</h1>

<p>
Every tulip reminds me of your beautiful smile. 🌷✨
</p>

<button onclick="showLetter()">Open My Heart 💌</button>

<div id="letter">
<h2>For You ❤️</h2>
<p>
This little website is made just for you. 🌷
</p>
</div>

<script>
function showLetter(){
document.getElementById("letter").style.display="block";
}
</script>

</div>

</body>
</html>
