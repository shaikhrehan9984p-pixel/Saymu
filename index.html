<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Saymu 🌷❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffb6d9,#ffdce8,#fff5f8);
}

.card{
width:90%;
max-width:420px;
background:rgba(255,255,255,.22);
backdrop-filter:blur(15px);
padding:30px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;
color:#ff2f7d;
animation:fade 1.5s;
}

.bouquet{
font-size:70px;
animation:bounce 2s infinite;
}

h1{
margin-top:10px;
font-size:32px;
}

p{
margin-top:15px;
line-height:1.7;
font-size:18px;
}

button{
margin-top:25px;
padding:14px 30px;
border:none;
border-radius:40px;
background:#ff2f7d;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.06);
}

#letter{
display:none;
margin-top:20px;
}

@keyframes bounce{
50%{
transform:translateY(-10px);
}
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
